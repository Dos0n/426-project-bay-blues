services:
  incident-service:
    build:
      context: ./incident-service
    ports:
      - "${INCIDENT_SERVICE_PORT:-3001}:3000"
    environment:
      PORT: "3000"
      INCIDENT_LATENCY_MS: "${INCIDENT_LATENCY_MS:-200}"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://localhost:3000/health').then(r => { if (!r.ok) process.exit(1) }).catch(() => process.exit(1))
      interval: 5s
      timeout: 2s
      retries: 5
      start_period: 5s

  regional-routing-service:
    build:
      context: ./regional-routing-service
    environment:
      PORT: "3000"
      ROUTING_LATENCY_MS: "${ROUTING_LATENCY_MS:-200}"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://localhost:3000/health').then(r => { if (!r.ok) process.exit(1) }).catch(() => process.exit(1))
      interval: 5s
      timeout: 2s
      retries: 5
      start_period: 5s

  regional-routing-ambassador:
    build:
      context: ./regional-routing-ambassador
    ports:
      - "${ROUTING_AMBASSADOR_PORT:-3002}:3000"
    environment:
      PORT: "3000"
      UPSTREAM_URL: "${ROUTING_UPSTREAM_URL:-http://regional-routing-service:3000}"
      UPSTREAM_TIMEOUT_MS: "${ROUTING_UPSTREAM_TIMEOUT_MS:-2000}"
      MAX_RETRIES: "${ROUTING_MAX_RETRIES:-2}"
    depends_on:
      regional-routing-service:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://localhost:3000/health').then(r => { if (!r.ok) process.exit(1) }).catch(() => process.exit(1))
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s

  incident-ambassador:
    build:
      context: ./incident-ambassador
    ports:
      - "${INCIDENT_AMBASSADOR_PORT:-3003}:3000"
    environment:
      PORT: "3000"
      UPSTREAM_URL: "${INCIDENT_UPSTREAM_URL:-http://incident-service:3000}"
      UPSTREAM_TIMEOUT_MS: "${INCIDENT_UPSTREAM_TIMEOUT_MS:-2000}"
      MAX_RETRIES: "${INCIDENT_MAX_RETRIES:-2}"
    depends_on:
      incident-service:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://localhost:3000/health').then(r => { if (!r.ok) process.exit(1) }).catch(() => process.exit(1))
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s
