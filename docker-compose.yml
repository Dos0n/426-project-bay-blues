# AI: This file was generated or substantially modified with AI assistance. See AI-DISCLOSURE.md and ai/chats/2026-08-06-201302-austinf-sprint4-rabbitmq.jsonl.
services:
  incident-service:
    build:
      context: ./incident-service
    environment:
      PORT: "3000"
      INCIDENT_LATENCY_MS: "${INCIDENT_LATENCY_MS:-200}"
      RABBITMQ_HOST: "rabbitmq"
      RABBITMQ_PORT: "5672"
      RABBITMQ_HEARTBEAT_SECONDS: "${RABBITMQ_HEARTBEAT_SECONDS:-60}"
      RABBITMQ_USER: "${RABBITMQ_USER:-blue-light-app}"
      RABBITMQ_PASSWORD: "${RABBITMQ_PASSWORD:-blue-light-local-only}"
      NOTIFICATION_QUEUE: "${NOTIFICATION_QUEUE:-incident-notification-jobs}"
    depends_on:
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://localhost:3000/health').then(r => { if (!r.ok) process.exit(1) }).catch(() => process.exit(1))
      interval: 5s
      timeout: 2s
      retries: 5
      start_period: 5s

  # AI: Sprint 4 RabbitMQ broker stores durable incident-notification work.
  rabbitmq:
    image: rabbitmq:3-management
    hostname: rabbitmq
    # AI: Use the image's unprivileged account so its volume cookie remains readable under Colima.
    user: "rabbitmq"
    environment:
      RABBITMQ_DEFAULT_USER: "${RABBITMQ_USER:-blue-light-app}"
      RABBITMQ_DEFAULT_PASS: "${RABBITMQ_PASSWORD:-blue-light-local-only}"
    ports:
      - "${RABBITMQ_AMQP_PORT:-5672}:5672"
      - "${RABBITMQ_MANAGEMENT_PORT:-15672}:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test:
        - CMD
        - rabbitmq-diagnostics
        - -q
        - check_running
      interval: 5s
      timeout: 30s
      retries: 10
      start_period: 10s

  # AI: Sprint 4 standalone worker consumes one incident-notification job at a time.
  emergency-notification-worker:
    build:
      context: ./emergency-notification-worker
    ports:
      - "${NOTIFICATION_WORKER_PORT:-3005}:3000"
    environment:
      PORT: "3000"
      RABBITMQ_HOST: "rabbitmq"
      RABBITMQ_PORT: "5672"
      RABBITMQ_HEARTBEAT_SECONDS: "${RABBITMQ_HEARTBEAT_SECONDS:-60}"
      RABBITMQ_USER: "${RABBITMQ_USER:-blue-light-app}"
      RABBITMQ_PASSWORD: "${RABBITMQ_PASSWORD:-blue-light-local-only}"
      NOTIFICATION_QUEUE: "${NOTIFICATION_QUEUE:-incident-notification-jobs}"
      NOTIFICATION_PROCESSING_MS: "${NOTIFICATION_PROCESSING_MS:-500}"
    depends_on:
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://localhost:3000/health').then(r => { if (!r.ok) process.exit(1) }).catch(() => process.exit(1))
      interval: 5s
      timeout: 2s
      retries: 5
      start_period: 10s

  # AI: Sprint 3 shared Redis cache for regional-routing-service route lookups, reused across all replicas.
  redis:
    image: redis:7-alpine
    healthcheck:
      test:
        - CMD
        - redis-cli
        - ping
      interval: 5s
      timeout: 2s
      retries: 5
      start_period: 5s

  # AI: Sprint 3 uses three explicitly named, identical routing replicas so Caddy can target and test each instance independently.
  regional-routing-service-a:
    build:
      context: ./regional-routing-service
    environment:
      PORT: "3000"
      ROUTING_LATENCY_MS: "${ROUTING_LATENCY_MS:-200}"
      REPLICA_ID: "regional-routing-service-a"
      REDIS_URL: "redis://redis:6379"
      ROUTE_CACHE_TTL_SECONDS: "${ROUTE_CACHE_TTL_SECONDS:-30}"
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://localhost:3000/health').then(r => { if (!r.ok) process.exit(1) }).catch(() => process.exit(1))
      interval: 5s
      timeout: 2s
      retries: 5
      start_period: 5s

  regional-routing-service-b:
    build:
      context: ./regional-routing-service
    environment:
      PORT: "3000"
      ROUTING_LATENCY_MS: "${ROUTING_LATENCY_MS:-200}"
      REPLICA_ID: "regional-routing-service-b"
      REDIS_URL: "redis://redis:6379"
      ROUTE_CACHE_TTL_SECONDS: "${ROUTE_CACHE_TTL_SECONDS:-30}"
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://localhost:3000/health').then(r => { if (!r.ok) process.exit(1) }).catch(() => process.exit(1))
      interval: 5s
      timeout: 2s
      retries: 5
      start_period: 5s

  regional-routing-service-c:
    build:
      context: ./regional-routing-service
    environment:
      PORT: "3000"
      ROUTING_LATENCY_MS: "${ROUTING_LATENCY_MS:-200}"
      REPLICA_ID: "regional-routing-service-c"
      REDIS_URL: "redis://redis:6379"
      ROUTE_CACHE_TTL_SECONDS: "${ROUTE_CACHE_TTL_SECONDS:-30}"
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://localhost:3000/health').then(r => { if (!r.ok) process.exit(1) }).catch(() => process.exit(1))
      interval: 5s
      timeout: 2s
      retries: 5
      start_period: 5s

  # AI: Sprint 3 Caddy load balances the routing replicas while keeping them internal to the Compose network.
  regional-routing-load-balancer:
    image: caddy:2-alpine
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
    depends_on:
      regional-routing-service-a:
        condition: service_healthy
      regional-routing-service-b:
        condition: service_healthy
      regional-routing-service-c:
        condition: service_healthy
    # AI: Sprint 4 Task 2 — Compose healthcheck probes proxied /health so healthy means Caddy can serve a replica.
    healthcheck:
      test:
        - CMD
        - curl
        - -fsS
        - http://localhost:3000/health
      interval: 5s
      timeout: 2s
      retries: 5
      start_period: 20s

  regional-routing-ambassador:
    build:
      context: ./regional-routing-ambassador
    ports:
      - "${ROUTING_AMBASSADOR_PORT:-3002}:3000"
    environment:
      PORT: "3000"
      # AI: Sprint 3 keeps one stable ambassador upstream while Caddy owns routing-replica selection.
      UPSTREAM_URL: "${ROUTING_UPSTREAM_URL:-http://regional-routing-load-balancer:3000}"
      UPSTREAM_TIMEOUT_MS: "${ROUTING_UPSTREAM_TIMEOUT_MS:-2000}"
      MAX_RETRIES: "${ROUTING_MAX_RETRIES:-2}"
    depends_on:
      regional-routing-load-balancer:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://localhost:3000/health').then(r => { if (!r.ok) process.exit(1) }).catch(() => process.exit(1))
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s

  incident-ambassador:
    build:
      context: ./incident-ambassador
    ports:
      - "${INCIDENT_AMBASSADOR_PORT:-3003}:3000"
    environment:
      PORT: "3000"
      UPSTREAM_URL: "${INCIDENT_UPSTREAM_URL:-http://incident-service:3000}"
      UPSTREAM_TIMEOUT_MS: "${INCIDENT_UPSTREAM_TIMEOUT_MS:-2000}"
      MAX_RETRIES: "${INCIDENT_MAX_RETRIES:-2}"
      AMBASSADOR_PROCESSING_DELAY_MS: "${INCIDENT_AMBASSADOR_PROCESSING_DELAY_MS:-50}"
    depends_on:
      incident-service:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://localhost:3000/health').then(r => { if (!r.ok) process.exit(1) }).catch(() => process.exit(1))
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s

  responder-dispatch-service:
    build:
      context: ./responder-dispatch-service
    ports:
      - "${DISPATCH_SERVICE_PORT:-3004}:3000"
    environment:
      PORT: "3000"
      DISPATCH_LATENCY_MS: "${DISPATCH_LATENCY_MS:-200}"
      # AI: Sprint 4 Task 3 scripted-failure toggle; default off keeps startup all-healthy.
      DISPATCH_FAULT_MODE: "${DISPATCH_FAULT_MODE:-off}"
      DISPATCH_FAULT_LATENCY_MS: "${DISPATCH_FAULT_LATENCY_MS:-6000}"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://localhost:3000/health').then(r => { if (!r.ok) process.exit(1) }).catch(() => process.exit(1))
      interval: 5s
      timeout: 2s
      retries: 5
      start_period: 5s

  # AI: Sprint 5 Prometheus startup, configuration mount, port, and healthcheck were added with AI assistance. See AI-DISCLOSURE.md and ai/chats/2026-08-10-161106-sprint-5-prometheus-final.jsonl.
  prometheus:
    image: prom/prometheus
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    healthcheck:
      test:
        - CMD
        - wget
        - --spider
        - --quiet
        - http://localhost:9090/-/healthy
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s

  # AI: Sprint 5 Grafana service and Prometheus datasource provisioning mount were added with AI assistance.
  grafana:
    image: grafana/grafana
    ports:
      - "${GRAFANA_PORT:-3006}:3000"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    healthcheck:
      test:
        - CMD
        - wget
        - --spider
        - --quiet
        - http://localhost:3000/api/health
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s

volumes:
  rabbitmq-data:
# AI: End AI-assisted file. See AI-DISCLOSURE.md and ai/chats/2026-08-06-201302-austinf-sprint4-rabbitmq.jsonl.
